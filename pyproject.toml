[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-rays-live-dashboard"
version = "1.0.0"
description = "Kafka + Spark streaming monitor for mini Drift Tube cosmic-ray detectors"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
    "boto3>=1.24",
    "kafka-python>=2.0.2",
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=1.3",
    "python-dotenv>=1.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
spark = ["findspark>=2.0"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
cosmic-producer = "cosmic_rays.producer:main"
cosmic-processor = "cosmic_rays.processing:main"
cosmic-dashboard = "cosmic_rays.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
